# Multimodal AI Research Framework Configuration

model:
  name: multimodal_transformer
  d_model: 512
  n_heads: 8
  n_layers: 6
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 512
  vocab_size: 32000

video:
  scene_detection:
    threshold: 30.0
    min_scene_length: 15
    sample_interval: 3
  keyframe_extraction:
    n_keyframes: 3
    method: cluster  # cluster | uniform
    sample_interval: 5

speech:
  sample_rate: 16000
  frame_length: 2048
  hop_length: 512
  noise_frames: 6
  vad_threshold: 0.01
  noise_factor: 2.0

evaluation:
  judge_model: gpt-4
  dimensions:
    - accuracy
    - relevance
    - completeness
    - coherence
    - fluency
  visual_metrics:
    - psnr
    - ssim
    - lpips
  audio_metrics:
    - stoi
    - snr
    - pesq

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear  # linear | cosine
  image_size: 64

llm_finetune:
  sft:
    learning_rate: 0.00002
    batch_size: 4
    num_epochs: 3
  dpo:
    learning_rate: 0.0000005
    beta: 0.1
    num_epochs: 1
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules:
      - q_proj
      - v_proj
      - k_proj
      - o_proj

agent:
  model: gpt-4
  temperature: 0.3
  max_iterations: 10
  tools:
    - scene_detection
    - keyframe_extraction
    - summarization
